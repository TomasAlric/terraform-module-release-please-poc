name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_missing_token:
        description: Exercise the missing credential guard
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.repository == 'TomasAlric/terraform-module-release-please-poc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify release credential
        env:
          GH_TOKEN: ${{ inputs.test_missing_token != true && secrets.RELEASE_PLEASE_TOKEN || '' }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::RELEASE_PLEASE_TOKEN is required"
            exit 1
          fi
          test "$(gh api user --jq .id)" = 82914085
          echo "Authenticated writer: TomasAlric (82914085)" >> "$GITHUB_STEP_SUMMARY"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          skip-github-pull-request: true
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install pinned Release Please library
        run: npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - name: Reconcile Release PR without rewriting history
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/release/candidate.cjs
      - if: always()
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: echo "Reconciliação de $GITHUB_SHA · tag $TAG" >> "$GITHUB_STEP_SUMMARY"
