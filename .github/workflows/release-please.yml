name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_missing_token:
        description: Exercise the missing credential guard
        type: boolean
        default: false
permissions: {}
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  authorize:
    if: github.ref == 'refs/heads/main' && github.repository == 'TomasAlric/terraform-module-release-please-poc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      proposal: ${{ steps.verify.outputs.proposal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - name: Verify exact merged release candidate
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CERTIFICATION_RUN: ${{ vars.EXPECTED_CERTIFICATION_RUN }}
        run: node scripts/release/publication.cjs authorize
  release:
    needs: authorize
    if: github.ref == 'refs/heads/main' && github.repository == 'TomasAlric/terraform-module-release-please-poc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify release credential
        env:
          GH_TOKEN: ${{ inputs.test_missing_token != true && secrets.RELEASE_PLEASE_TOKEN || '' }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::RELEASE_PLEASE_TOKEN is required"
            exit 1
          fi
          test "$(gh api user --jq .id)" = 82914085
          echo "Authenticated writer: TomasAlric (82914085)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Install pinned Release Please library
        run: npm ci --prefix scripts/release --ignore-scripts --no-audit --no-fund
      - name: Publish certified SHA with Release Please
        if: needs.authorize.outputs.proposal != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          CERTIFIED_PROPOSAL: ${{ needs.authorize.outputs.proposal }}
        run: node scripts/release/publication.cjs publish
      - name: Reconcile Release PR without rewriting history
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: node scripts/release/candidate.cjs
      - if: always()
        run: echo "Reconciliação de $GITHUB_SHA · ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
