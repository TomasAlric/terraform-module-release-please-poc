name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-please-main
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: always()
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          CREATED: ${{ steps.release.outputs.prs_created }}
        run: echo "Reconciliação de $GITHUB_SHA · tag $TAG · PR atualizado $CREATED" >> "$GITHUB_STEP_SUMMARY"
